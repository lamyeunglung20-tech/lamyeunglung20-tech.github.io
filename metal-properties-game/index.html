    ].map(([category,type,zh,en,choices,correct,exZh,exEn],id)=>({id,category,type,prompt:{zh,en},choices:choices?.map(([zh,en])=>({zh,en})),correct,explanation:{zh:exZh,en:exEn}}));
    const $=id=>document.getElementById(id);
    const state={lang:"zh",scope:"all",count:"all",session:null};
    const tr=(key,values={})=>T[state.lang][key].replace(/\{(\w+)\}/g,(_,name)=>String(values[name]??""));
    const shuffle=source=>{const a=[...source];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function questionPool(){
      const relevant=Q.filter(q=>state.scope==="all"||q.category===state.scope);
      const classify=shuffle(relevant.filter(q=>q.type==="classify"));
      const facts=shuffle(relevant.filter(q=>q.type==="facts"));
      const ordered=[];
      let next=Math.random()<.5?"classify":"facts";
      while(classify.length||facts.length){
        const current=next==="classify"?classify:facts;
        const other=next==="classify"?facts:classify;
        ordered.push((current.length?current:other).pop());
        next=next==="classify"?"facts":"classify";
      }
      return ordered;
    }
    function setView(view){for(const id of ["home","review-view","quiz-view","result-view"])$(id).hidden=id!==view;window.scrollTo({top:0,behavior:"smooth"})}
    function choose(group,attribute,value){document.querySelectorAll(`#${group} [${attribute}]`).forEach(button=>{const selected=button.getAttribute(attribute)===value;button.classList.toggle("selected",selected);button.setAttribute("aria-pressed",String(selected))})}
    function updateI18n(){document.documentElement.lang=state.lang==="zh"?"zh-Hant":"en";document.title=tr("title");document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=tr(el.dataset.i18n)});$("language-label").textContent=state.lang==="zh"?"切換語言":"Switch language";$("language").setAttribute("aria-label",$("language-label").textContent);for(const [group,label] of [["scope-options","scopeHeading"],["count-options","countHeading"],["answer-grid","answerChoices"]])$(group).setAttribute("aria-label",tr(label));if(!$("review-view").hidden)renderReview();if(state.session){if(!$("quiz-view").hidden)renderQuestion();if(!$("result-view").hidden)renderResult()}}
    function renderReview(){const body=$("compare-body");body.replaceChildren();TABLE.forEach(row=>{const trEl=document.createElement("tr");for(const index of state.lang==="zh"?[0,2,4,6]:[1,3,5,7]){const cell=document.createElement("td");cell.textContent=row[index]??"—";trEl.append(cell)}body.append(trEl)})}
    function start(kind){const pool=questionPool();const count=kind==="death"||state.count==="all"?pool.length:Math.min(Number(state.count),pool.length);state.session={kind,questions:pool.slice(0,count),index:0,correct:0,wrong:0,misses:[],answered:false,selected:null,config:{scope:state.scope,count:state.count}};setView("quiz-view");renderQuestion()}
    function optionsFor(q){if(q.type==="classify")return T[state.lang].categories.map((_,i)=>({key:i}));return shuffle(q.choices.map((_,i)=>({key:i})))}
    function answerLabel(q,key){return q.type==="classify"?T[state.lang].categories[key]:q.choices[key][state.lang]}
    function renderQuestion(){const s=state.session,q=s.questions[s.index];$("quiz-title").textContent=tr(s.kind==="death"?"death":"training");$("step-label").textContent=tr("question",{current:s.index+1,total:s.questions.length});$("score-label").textContent=s.kind==="death"?tr("lives",{correct:s.correct,left:5-s.wrong}):tr("score",{correct:s.correct,wrong:s.wrong});$("progress-fill").style.width=`${(s.index+(s.answered?1:0))/s.questions.length*100}%`;$("prompt-label").textContent=tr(q.type==="classify"?"classifyLabel":"factsLabel");$("prompt").textContent=q.prompt[state.lang];if(!s.options)s.options=optionsFor(q);const grid=$("answer-grid");grid.replaceChildren();s.options.forEach((option,i)=>{const button=document.createElement("button");button.type="button";button.className="answer";button.disabled=s.answered;if(s.answered&&option.key===q.correct)button.classList.add("correct");if(s.answered&&s.selected===option.key&&option.key!==q.correct)button.classList.add("wrong");const key=document.createElement("span");key.className="answer-key";key.textContent="ABCD"[i];const label=document.createElement("strong");label.textContent=answerLabel(q,option.key);button.append(key,label);button.addEventListener("click",()=>answer(option.key));grid.append(button)});$("feedback").hidden=!s.answered;if(s.answered){$("feedback").className=`feedback ${s.selected===q.correct?"good":"bad"}`;$("feedback").textContent=tr(s.selected===q.correct?"right":"wrong",{answer:answerLabel(q,q.correct),explanation:q.explanation[state.lang]})}$("next").hidden=!s.answered;$("next").textContent=tr(s.index===s.questions.length-1||(s.kind==="death"&&s.wrong>=5)?"seeResult":"next")}
    function answer(key){const s=state.session;if(!s||s.answered)return;s.answered=true;s.selected=key;const q=s.questions[s.index];if(key===q.correct)s.correct++;else{s.wrong++;s.misses.push(q)}renderQuestion()}
    function advance(){const s=state.session;if(!s||!s.answered)return;if(s.index+1>=s.questions.length||(s.kind==="death"&&s.wrong>=5)){setView("result-view");renderResult();return}s.index++;s.answered=false;s.selected=null;s.options=null;renderQuestion()}
    function renderResult(){const s=state.session,answered=s.correct+s.wrong,failed=s.kind==="death"&&s.wrong>=5;$("result-icon").textContent=failed?"☠️":s.wrong===0?"🏆":"🎉";$("result-title").textContent=tr(failed?"failed":"success");$("result-summary").textContent=tr(s.kind==="death"?"deathResult":"result",{correct:s.correct,wrong:s.wrong,answered,percent:Math.round(s.correct/answered*100)});$("missed-wrap").hidden=s.misses.length===0;$("missed-list").replaceChildren();s.misses.forEach(q=>{const row=document.createElement("div");row.className="missed-row";const prompt=document.createElement("span");prompt.textContent=q.prompt[state.lang];const solution=document.createElement("strong");solution.textContent=answerLabel(q,q.correct);const explanation=document.createElement("small");explanation.textContent=q.explanation[state.lang];row.append(prompt,solution,explanation);$("missed-list").append(row)})}
    document.querySelectorAll("#scope-options [data-scope]").forEach(button=>button.addEventListener("click",()=>{state.scope=button.dataset.scope;choose("scope-options","data-scope",state.scope)}));
    document.querySelectorAll("#count-options [data-count]").forEach(button=>button.addEventListener("click",()=>{state.count=button.dataset.count;choose("count-options","data-count",state.count)}));
    $("language").addEventListener("click",()=>{state.lang=state.lang==="zh"?"en":"zh";updateI18n()});$("review-open").addEventListener("click",()=>{renderReview();setView("review-view")});document.querySelectorAll("[data-back]").forEach(button=>button.addEventListener("click",()=>{state.session=null;setView("home")}));$("start-training").addEventListener("click",()=>start("training"));$("start-death").addEventListener("click",()=>start("death"));$("next").addEventListener("click",advance);$("retry").addEventListener("click",()=>{const {config,kind}=state.session;Object.assign(state,config);choose("scope-options","data-scope",state.scope);choose("count-options","data-count",state.count);start(kind)});
    document.addEventListener("keydown",event=>{if($("quiz-view").hidden||event.altKey||event.ctrlKey||event.metaKey||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(state.session.answered&&event.key==="Enter"){event.preventDefault();advance()}else if(!state.session.answered&&/^[1-4a-dA-D]$/.test(event.key)){const i=/[1-4]/.test(event.key)?Number(event.key)-1:event.key.toUpperCase().charCodeAt(0)-65;const option=state.session.options[i];if(option){event.preventDefault();answer(option.key)}}});
    updateI18n();
  })();
